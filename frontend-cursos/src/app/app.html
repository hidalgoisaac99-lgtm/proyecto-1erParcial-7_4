<app-encabezado></app-encabezado>

<div class="container mt-4">

  <h2 class="text-center mb-4">
    Administración de cursos
  </h2>

  <div class="row mb-4">

    <div class="col-md-4">
      <div class="card bg-primary text-white text-center p-3">
        <h5>Total de cursos</h5>
        <h2>{{ cursos.length }}</h2>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card bg-success text-white text-center p-3">
        <h5>Cursos activos</h5>
        <h2>{{ cursosActivos }}</h2>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card bg-danger text-white text-center p-3">
        <h5>Cursos inactivos</h5>
        <h2>{{ cursosInactivos }}</h2>
      </div>
    </div>

  </div>

  <!-- FORMULARIO -->
  <app-formulario-curso
    [cursoEditar]="cursoSeleccionado"
    (guardar)="guardarCurso($event)"
    (cancelar)="cancelarEdicion()">
  </app-formulario-curso>

  <!-- LISTA DE CURSOS -->
  <app-lista-cursos
    [cursos]="cursos"
    (editar)="editarCurso($event)"
    (eliminar)="eliminarCurso($event)"
    (cambiarEstado)="cambiarEstado($event)">
  </app-lista-cursos>

</div>

<app-pie-pagina></app-pie-pagina>
